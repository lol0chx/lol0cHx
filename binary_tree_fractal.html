<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recursive Binary Tree Fractal</title>
  <style>
    body { background: #222; margin: 0; overflow: hidden; }
    canvas { display: block; margin: 0 auto; background: #222; }
  </style>
</head>
<body>
  <canvas id="treeCanvas"></canvas>
  <script>
    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');
    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    // Parameters
    const maxDepth = 11;
    const trunkLength = height / 4;
    const branchAngle = Math.PI / 4;
    const lengthDecay = 0.7;
    const angleJitter = 0.15;
    const growSpeed = 0.025; // How fast the tree grows
    const windStrength = 0.15;
    const windSpeed = 0.7;

    // Animation state
    let growProgress = 0; // 0 to 1
    let lastTimestamp = 0;
    let windTime = 0;

    function drawTree(x, y, angle, length, depth, grow, windPhase) {
      if (depth === 0 || length < 2) return;
      // Animate growth: only draw up to a fraction of the branch
      const growThis = Math.min(grow, 1);
      const x2 = x + Math.sin(angle) * length * growThis;
      const y2 = y - Math.cos(angle) * length * growThis;
      ctx.lineWidth = Math.max(1, depth * 0.7);
      ctx.strokeStyle = `hsl(${90 + depth * 10}, 60%, ${30 + depth * 4}%)`;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      if (grow < 1) return; // Only branch if fully grown
      // Wind sway
      const sway = Math.sin(windPhase + depth * 0.5) * windStrength * (depth / maxDepth);
      // Random angle variation for natural look
      const leftAngle = angle - branchAngle + (Math.random() - 0.5) * angleJitter + sway;
      const rightAngle = angle + branchAngle + (Math.random() - 0.5) * angleJitter + sway;
      // Recursively draw branches
      drawTree(x2, y2, leftAngle, length * lengthDecay, depth - 1, grow, windPhase);
      drawTree(x2, y2, rightAngle, length * lengthDecay, depth - 1, grow, windPhase);
    }

    function animate(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;
      ctx.clearRect(0, 0, width, height);
      // Grow phase
      if (growProgress < 1) {
        growProgress += growSpeed * dt * 60;
        if (growProgress > 1) growProgress = 1;
      } else {
        windTime += dt * windSpeed;
      }
      drawTree(
        width / 2,
        height - 40,
        -Math.PI / 2,
        trunkLength,
        maxDepth,
        growProgress,
        windTime
      );
      requestAnimationFrame(animate);
    }

    // Responsive resize
    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    });

    animate(0);
  </script>
</body>
</html>
