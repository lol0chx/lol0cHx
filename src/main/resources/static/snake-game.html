<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake Game — Henok's Portfolio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 50%, #0c1a2e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: white;
            padding: 20px;
            overflow: hidden;
        }

        /* Decorative blobs */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 500px 400px at 10% 20%, rgba(245,87,108,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 400px 300px at 90% 80%, rgba(102,126,234,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 300px 250px at 60% 0%, rgba(16,185,129,0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        .back-link {
            position: fixed;
            top: 18px;
            left: 20px;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s, transform 0.2s;
            z-index: 100;
            padding: 8px 14px;
            background: rgba(255,255,255,0.07);
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .back-link:hover { color: white; transform: translateX(-2px); }

        .game-title {
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            font-weight: 900;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #38ef7d 0%, #11998e 50%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            position: relative;
            z-index: 1;
        }

        .game-tagline {
            font-size: 13px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 18px;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }

        .score-bar {
            display: flex;
            gap: 30px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }
        .score-box {
            text-align: center;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 10px 22px;
            min-width: 80px;
        }
        .score-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin-bottom: 4px;
        }
        .score-val {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1;
        }
        #score-display { color: #38ef7d; }
        #best-display  { color: #ff9a56; }
        #level-display { color: #a5b4fc; }

        .canvas-wrapper {
            position: relative;
            display: inline-block;
            border-radius: 20px;
            z-index: 1;
            box-shadow:
                0 0 0 2px rgba(56,239,125,0.2),
                0 30px 80px rgba(0,0,0,0.5),
                0 0 80px rgba(56,239,125,0.08);
        }

        #gameCanvas {
            border-radius: 20px;
            display: block;
            touch-action: none;
        }

        /* Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 30, 0.82);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            z-index: 10;
            gap: 8px;
        }
        .overlay-emoji { font-size: 52px; margin-bottom: 6px; }
        .overlay h2 {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -0.02em;
        }
        .overlay .sub {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.5;
        }

        .play-btn {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            border: none;
            color: #0f172a;
            padding: 13px 36px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 24px rgba(56,239,125,0.4);
            letter-spacing: 0.3px;
        }
        .play-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 14px 36px rgba(56,239,125,0.5);
        }
        .play-btn:active { transform: scale(0.98); }

        /* Mobile controls */
        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 52px);
            grid-template-rows: repeat(2, 52px);
            gap: 6px;
            margin-top: 16px;
            position: relative;
            z-index: 1;
        }
        @media (max-width: 600px) {
            .mobile-controls { display: grid; }
        }

        .ctrl-btn {
            width: 52px; height: 52px;
            background: rgba(255,255,255,0.08);
            border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .ctrl-btn:active {
            background: rgba(56,239,125,0.2);
            border-color: rgba(56,239,125,0.4);
            transform: scale(0.92);
        }
        .ctrl-up    { grid-column: 2; grid-row: 1; }
        .ctrl-left  { grid-column: 1; grid-row: 2; }
        .ctrl-down  { grid-column: 2; grid-row: 2; }
        .ctrl-right { grid-column: 3; grid-row: 2; }

        .hints {
            margin-top: 12px;
            font-size: 11px;
            color: rgba(255,255,255,0.22);
            letter-spacing: 1px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

    <a href="/" class="back-link" onclick="history.back(); return false;">&#8592; Portfolio</a>

    <h1 class="game-title">Snake 🐍</h1>
    <p class="game-tagline">Eat, grow, don't bite yourself.</p>

    <div class="score-bar">
        <div class="score-box">
            <div class="score-label">Score</div>
            <div class="score-val" id="score-display">0</div>
        </div>
        <div class="score-box">
            <div class="score-label">Best</div>
            <div class="score-val" id="best-display">0</div>
        </div>
        <div class="score-box">
            <div class="score-label">Level</div>
            <div class="score-val" id="level-display">1</div>
        </div>
    </div>

    <div class="canvas-wrapper">
        <canvas id="gameCanvas"></canvas>

        <div class="overlay" id="overlay">
            <div class="overlay-emoji">🐍</div>
            <h2>Snake Game</h2>
            <p class="sub">Arrow keys or WASD to move<br>Space to pause · Swipe on mobile</p>
            <button class="play-btn" onclick="startGame()">▶ Play</button>
        </div>
    </div>

    <!-- Mobile d-pad -->
    <div class="mobile-controls">
        <button class="ctrl-btn ctrl-up"    onclick="setDir(0,-1)">▲</button>
        <button class="ctrl-btn ctrl-left"  onclick="setDir(-1,0)">◀</button>
        <button class="ctrl-btn ctrl-down"  onclick="setDir(0,1)">▼</button>
        <button class="ctrl-btn ctrl-right" onclick="setDir(1,0)">▶</button>
    </div>

    <p class="hints">ARROW KEYS / WASD &nbsp;·&nbsp; SPACE TO PAUSE</p>

    <script>
        const canvas  = document.getElementById('gameCanvas');
        const ctx     = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');

        const scoreEl = document.getElementById('score-display');
        const bestEl  = document.getElementById('best-display');
        const levelEl = document.getElementById('level-display');

        /* ── Sizing ── */
        const GRID  = 20;
        let COLS, ROWS;

        function resize() {
            const maxW = Math.min(window.innerWidth - 40, 460);
            const maxH = Math.min(window.innerHeight - 300, 460);
            const size = Math.floor(Math.min(maxW, maxH) / GRID) * GRID;
            canvas.width  = size;
            canvas.height = size;
            COLS = canvas.width  / GRID;
            ROWS = canvas.height / GRID;
        }
        resize();
        window.addEventListener('resize', () => { resize(); if (!running) drawIdle(); });

        /* ── State ── */
        let snake, dir, nextDir, food, score, level, speed;
        let gameLoop, running = false, paused = false;
        let best = parseInt(localStorage.getItem('snakeBest') || '0');
        bestEl.textContent = best;

        /* ── Helpers ── */
        function placeFood() {
            let pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * COLS),
                    y: Math.floor(Math.random() * ROWS)
                };
            } while (snake.some(s => s.x === pos.x && s.y === pos.y));
            food = pos;
        }

        function setDir(dx, dy) {
            if (!running) return;
            // Prevent 180° reversal
            if (dx !== -dir.x || dy !== -dir.y) {
                nextDir = { x: dx, y: dy };
            }
        }

        /* ── Start ── */
        function startGame() {
            overlay.style.display = 'none';
            const cx = Math.floor(COLS / 2);
            const cy = Math.floor(ROWS / 2);
            snake   = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
            dir     = { x: 1, y: 0 };
            nextDir = { x: 1, y: 0 };
            score   = 0;
            level   = 1;
            speed   = 145;
            paused  = false;
            running = true;
            scoreEl.textContent = 0;
            levelEl.textContent = 1;
            placeFood();
            clearInterval(gameLoop);
            gameLoop = setInterval(tick, speed);
        }

        /* ── Game loop ── */
        function tick() {
            if (paused) return;
            dir = { ...nextDir };

            const head = {
                x: snake[0].x + dir.x,
                y: snake[0].y + dir.y
            };

            // Wrap walls (toggled off — hard walls instead)
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                return endGame();
            }
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                return endGame();
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10 * level;
                scoreEl.textContent = score;
                if (score > best) {
                    best = score;
                    bestEl.textContent = best;
                    localStorage.setItem('snakeBest', best);
                }
                const newLevel = Math.min(10, Math.floor(score / 60) + 1);
                if (newLevel > level) {
                    level = newLevel;
                    levelEl.textContent = level;
                    clearInterval(gameLoop);
                    speed = Math.max(55, 145 - (level - 1) * 14);
                    gameLoop = setInterval(tick, speed);
                }
                placeFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function endGame() {
            clearInterval(gameLoop);
            running = false;
            overlay.innerHTML = `
                <div class="overlay-emoji">💀</div>
                <h2>Game Over</h2>
                <p class="sub">Score: <strong style="color:#38ef7d">${score}</strong> &nbsp;·&nbsp; Best: <strong style="color:#ff9a56">${best}</strong></p>
                <button class="play-btn" onclick="startGame()">▶ Play Again</button>
            `;
            overlay.style.display = 'flex';
        }

        /* ── Draw ── */
        function drawIdle() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawGrid();
        }

        function drawGrid() {
            ctx.fillStyle = 'rgba(255,255,255,0.025)';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    ctx.beginPath();
                    ctx.arc(c * GRID + GRID / 2, r * GRID + GRID / 2, 1, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function draw() {
            /* Background */
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawGrid();

            /* Food — glowing pulsing orb */
            const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 220);
            const fr    = GRID / 2 - 2 + pulse * 2.5;
            const fx    = food.x * GRID + GRID / 2;
            const fy    = food.y * GRID + GRID / 2;

            ctx.shadowColor = '#f5576c';
            ctx.shadowBlur  = 18 + pulse * 10;
            const grd = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr + 4);
            grd.addColorStop(0, '#ff8a9a');
            grd.addColorStop(1, '#f5576c');
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.arc(fx, fy, fr, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            /* Snake */
            snake.forEach((seg, i) => {
                const t = i / snake.length;
                /* Head: bright green → tail: deep teal */
                const r = Math.round(56  + (16  - 56)  * t);
                const g = Math.round(239 + (185 - 239) * t);
                const b = Math.round(125 + (129 - 125) * t);
                ctx.fillStyle = `rgb(${r},${g},${b})`;

                const pad = i === 0 ? 1 : 2;
                const rr  = i === 0 ? 8 : 5;
                const x   = seg.x * GRID + pad;
                const y   = seg.y * GRID + pad;
                const w   = GRID - pad * 2;

                /* Glow on head */
                if (i === 0) {
                    ctx.shadowColor = '#38ef7d';
                    ctx.shadowBlur  = 12;
                }

                ctx.beginPath();
                roundRect(ctx, x, y, w, w, rr);
                ctx.fill();
                ctx.shadowBlur = 0;

                /* Eyes on head */
                if (i === 0) {
                    ctx.fillStyle = '#0f172a';
                    const eyeSize = 2.5;
                    let e1, e2;
                    const cx = seg.x * GRID + GRID / 2;
                    const cy = seg.y * GRID + GRID / 2;
                    if (dir.x === 1)       { e1 = [cx + 3, cy - 4]; e2 = [cx + 3, cy + 4]; }
                    else if (dir.x === -1) { e1 = [cx - 3, cy - 4]; e2 = [cx - 3, cy + 4]; }
                    else if (dir.y === -1) { e1 = [cx - 4, cy - 3]; e2 = [cx + 4, cy - 3]; }
                    else                   { e1 = [cx - 4, cy + 3]; e2 = [cx + 4, cy + 3]; }
                    ctx.beginPath(); ctx.arc(e1[0], e1[1], eyeSize, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(e2[0], e2[1], eyeSize, 0, Math.PI * 2); ctx.fill();
                }
            });
        }

        /* Polyfill for roundRect */
        function roundRect(ctx, x, y, w, h, r) {
            if (ctx.roundRect) {
                ctx.roundRect(x, y, w, h, r);
            } else {
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
            }
        }

        /* ── Keyboard ── */
        document.addEventListener('keydown', e => {
            const keyMap = {
                ArrowUp:    [0, -1], w: [0, -1], W: [0, -1],
                ArrowDown:  [0,  1], s: [0,  1], S: [0,  1],
                ArrowLeft:  [-1, 0], a: [-1, 0], A: [-1, 0],
                ArrowRight: [1,  0], d: [1,  0], D: [1,  0],
            };
            const mv = keyMap[e.key];
            if (mv) {
                e.preventDefault();
                setDir(mv[0], mv[1]);
            }
            if (e.key === ' ') {
                e.preventDefault();
                if (running) paused = !paused;
            }
        });

        /* ── Touch / Swipe ── */
        let touchStart = null;
        canvas.addEventListener('touchstart', e => {
            touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }, { passive: true });

        canvas.addEventListener('touchend', e => {
            if (!touchStart || !running) return;
            const dx = e.changedTouches[0].clientX - touchStart.x;
            const dy = e.changedTouches[0].clientY - touchStart.y;
            if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
            if (Math.abs(dx) > Math.abs(dy)) {
                setDir(dx > 0 ? 1 : -1, 0);
            } else {
                setDir(0, dy > 0 ? 1 : -1);
            }
            touchStart = null;
        }, { passive: true });

        /* Initial idle draw */
        drawIdle();
    </script>
</body>
</html>
